name: Nightly Database Backup

on:
  schedule:
    # 02:00 UTC daily — off-peak, well clear of any deploy window.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    # Configure these as repository secrets before enabling this workflow:
    #   DATABASE_URL, BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID,
    #   AWS_SECRET_ACCESS_KEY, and AWS_ENDPOINT_URL if not using AWS S3.
    # Until they're set this job fails fast with a clear error instead of
    # silently doing nothing (scripts/backup-database.sh exits non-zero).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client and awscli
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client awscli

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: ./scripts/backup-database.sh
